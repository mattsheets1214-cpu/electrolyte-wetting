# Test, build and (on main only) deploy the site to GitHub Pages.
#
# - Pull requests: run every test and a production build. Nothing is published.
# - Push to main (e.g. merging an approved PR): same checks, then deploy.
# If any test fails, the deploy job never runs, so a broken model cannot go live.
name: Test, build and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python/requirements-dev.txt

      - name: Install JavaScript dependencies (exact versions from package-lock.json)
        run: npm ci

      - name: Install Python test dependencies
        run: python -m pip install -r python/requirements-dev.txt

      - name: JavaScript tests (verification suite, physics, Pyodide cross-check, content)
        run: npm test

      - name: Python tests (reference model + SciPy cross-check)
        run: python -m pytest python/tests -q

      - name: Production build
        run: npm run build

      - name: Upload site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
